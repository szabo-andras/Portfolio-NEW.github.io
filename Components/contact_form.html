<form id="contact-form" action="https://formspree.io/f/mpqvkgpn" method="post">
  <h2 class="form-group">Text me</h2>
  <section class="form-group">
    <label for="first-name">First Name:</label>
    <input id="first-name" type="text" placeholder="First name" name="first-name" />

    <label for="surname">Surname:</label>
    <input type="text" id="surname" placeholder="Surname" name="surname" />
  </section>
  <section class="form-group form-full">
    <label for="email">E-mail:</label>
    <input type="email" id="email" placeholder="your@example.com" name="email" />
  </section>

  <section class="form-group form-full">
    <label for="message">Message:</label>
    <textarea id="message" placeholder="Write here your message..." name="message"></textarea>
  </section>

  <section id="Contact_reasons_section">
    <h2>What can I help you with?</h2>
    <label for="website-development-chkbox">Website development</label>
    <input type="checkbox" id="website-development-chkbox" name="website-development" />
    <label for="web-app-development-chkbox">Web application development</label>
    <input type="checkbox" id="web-app-development-chkbox" name="web-app-development" />
    <label for="website-redesign-chkbox">Website redesign / improvement</label>
    <input type="checkbox" id="website-redesign-chkbox" name="website-redesign" />
    <label for="Bug-fixing-chkbox">Bug fixing or maintenance</label>
    <input type="checkbox" id="Bug-fixing-chkbox" name="Bug-fixing" />
    <label for="Consultation-chkbox">Consultation / technical advice</label>
    <input type="checkbox" id="Consultation-chkbox" name="Consultation" />
    <label for="Job-opportunity-chkbox">Job opportunity</label>
    <input type="checkbox" id="Job-opportunity-chkbox" name="Job-opportunity" />
    <label for="Freelance-collaboration-chkbox">Freelance collaboration</label>
    <input type="checkbox" id="Freelance-collaboration-chkbox" name="Freelance-collaboration" />
    <label for="Other-chkbox">Other</label>
    <input type="checkbox" id="Other-chkbox" name="Other" />
  </section>

  <section id="Type-of-project-section">
    <h2>What type of project do you need?</h2>
    <label>
      <select name="project-type">
        <option value="0">Personal website</option>
        <option value="1">Portfolio website</option>
        <option value="2">Business website</option>
        <option value="3">E-commerce website</option>
        <option value="4">Web application</option>
        <option value="5">Internal tool / dashboard</option>
        <option value="6">Mobile application</option>
        <option value="7">Other</option>
      </select>
    </label>
  </section>

  <section id="Status-of-the-project-section">
    <h2>Where are you with your project?</h2>
    <label for="idea-only-radio">I have only an idea</label>
    <input type="radio" id="idea-only-radio" name="status-of-the-project" value="0" />
    <label for="design-mockup-radio">I have a design/mockup</label>
    <input type="radio" id="design-mockup-radio" name="status-of-the-project" value="1" />
    <label for="have-website-radio">I already have a website</label>
    <input type="radio" id="have-website-radio" name="status-of-the-project" value="2" />
    <label for="development-started-radio">Development has started</label>
    <input type="radio" id="development-started-radio" name="status-of-the-project" value="3" />
    <label for="need-improvements-radio">I need improvements or fixes</label>
    <input type="radio" id="need-improvements-radio" name="status-of-the-project" value="4" />
  </section>

  <section id="project-start-date-section">
    <h2 id="project-start-date-header">When would you like to start?</h2>
    <select id="project-start-date" name="project-start-date" area-labelledby="project-start-date-header">
      <option value="0">As soon as possible</option>
      <option value="1">Within 1 month</option>
      <option value="2">Within 3 months</option>
      <option value="3">Just planning at the moment</option>
    </select>
  </section>

  <section class="form-actions">
    <input type="submit" value="Submit" />
  </section>
</form>
