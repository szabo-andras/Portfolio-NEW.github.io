<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/CSS/styles.css" />
    <link rel="stylesheet" href="./CSS/multimedia_styles.css" />
    <title>Multimédia_gyakorlás</title>
  </head>
  <body>
    <header><div id="navbar"></div></header>
    <main>
      <h1 id="project_title">Multimédia_gyakorlás</h1>
      <img id="project_image" src="" alt="Multimédia_gyakorlás projekt képe" />
      <div id="project_status">In progress</div>
      <section id="project_tech_section">
        <h2>Felhasznált technológiák</h2>
        <div id="project_tech">
          <span>HTML</span>
          <span>CSS</span>
        </div>
      </section>
      <section id="project_description_section">
        <h2>Projekt leírása</h2>
        <p>Ez a projekt a multimédiás eszközök használatát mutatja be a HTML-ben</p>
      </section>
      <section>
        <h2>Online AUDIO</h2>
        <audio controls>
          <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" />
          Ez a szöveg csak akkor jelenik meg, ha a böngésződ nem támogatja az audio elemek lejátszását.
        </audio>
      </section>
      <section>
        <h2>Letöltött Audio</h2>
        <audio controls>
          <source src="./Multimedia/SoundHelix-Song-1.mp3" />
        </audio>
      </section>
      <section>
        <h2>Online VIDEO</h2>
        <video controls>
          <source src="https://www.w3schools.com/html/mov_bbb.mp4" />
        </video>
      </section>
      <section>
        <h2>Letöltött video</h2>
        <video controls>
          <source src="./Multimedia/mov_bbb.mp4" />
        </video>
      </section>
      <section>
        <h2>Youtube beágyazás</h2>
        <iframe
          src="https://www.youtube.com/embed/1gPY9fHtmzY?si=uwS8TxNY_GdpmIuo"
          title="YouTube video player"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
      </section>
    </main>
    <footer><div id="footer"></div></footer>
    <script src="/JS/components.js"></script>
  </body>
</html>
