        <h1>Kapcsolat</h1>
        <section>
            <h2>Írj nekünk</h2>
            <form action="https://formspree.io/f/xwlevngk" method="post">
                <fieldset>
                    <label for="nev">Név:</label>
                    <input type="text" placeholder="Név" id="nev" name="nev">

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="e-mail" placeholder="Email">
                    
                    <label for="uzenet-szovege">Üzenet</label>
                    <textarea id="uzenet-szovege" name="uzenet" placeholder="üzenet..."></textarea>

                    <label for="surgos-uzenet-checkbox">Sürgős</label>
                    <input type="checkbox" id="surgos-uzenet-checkbox">

                    
                    <input type="submit" value="Üzenet küldése">
                </fieldset>


            </form>
        </section>
