<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Portfolio</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
    <main>
        <h1>Admin login</h1>
        <form action="https://formspree.io/f/xdaqyree" method="post">
            <h2>Login form</h2>
            <section class="login_form_section">
                <label>
                    Username:<input type="email" name="username" placeholder="your@email.com" required>
                </label>
            </section>
            <section class="login_form_section">
                <label>
                    Password:<input type="password" name="password"  required>
                </label>
            </section>
            <section class="login_form_section"> 
                <input type="submit" value="Login">
            </section>



        </form>
    </main>
</body>
</html>
