<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>András Szabó - Portfolio Projects</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Risque&display=swap"
            rel="stylesheet" />

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
        <script src="https://kit.fontawesome.com/3235b2f9d7.js" crossorigin="anonymous"></script>
        <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css"
            integrity="sha384-r4NyP46KrjDleawBgD5tp8Y7UzmLA05oM1iAEQ17CSuDqnUK2+k9luXQOfXJCJ4I"
            crossorigin="anonymous" />
        <script
            src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
            integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
            crossorigin="anonymous"></script>
        <script
            src="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/js/bootstrap.min.js"
            integrity="sha384-oesi62hOLfzrys4LxRF63OJCXdXDipiYWBnvTl9Y9/TRlw5xlKIEHpNyvvDShgf/"
            crossorigin="anonymous"></script>
        <link rel="stylesheet" href="CSS/styles.css" />
    </head>
    <body>
        <header>
            <div id="navbar"></div>
        </header>

        <main>
            <h1>Portfolio</h1>
            <a href="contact.html" id="contact-button" class="button button-primary">Contact me</a>
            <a href="project_upload.html" id="project_upload-button" class="button button-primary"
                >Projekt feltöltése</a
            >
            <section class="projects-section">
                <h2>Projects</h2>
                <div id="projects-grid" class="projects-grid"></div>
            </section>

            <template id="project-card-template">
                <a class="project-card" href="#">
                    <h3 class="project-title"></h3>
                    <div class="project-preview">
                        <img src="" alt="" />
                    </div>
                    <div class="project-status">
                        <span class="status-dot"></span>
                        <span class="status-label"></span>
                    </div>
                    <div class="tech-list"></div>
                </a>
            </template>

            <section>
                <h2>Done</h2>
            </section>

            <section>
                <h2>Wishlist</h2>
                <p>Ebben a listában láthatóak a feladatok, amiket szeretnék megvalósítani:</p>
            </section>

            <section>
                <h2>In process</h2>
                <p>Folyamatban levő, még nem befejezett projektek listája</p>
            </section>
        </main>

        <footer id="footer"></footer>

        <script src="JS/components.js"></script>
        <script src="JS/portfolio-projects.js"></script>
    </body>
</html>
